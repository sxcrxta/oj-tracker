<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>문제 지도</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="library.css">
</head>
<body class="graph-page">
  <header class="top">
    <nav class="nav">
      <a href="/" class="brand">OJ 제출 기록</a>
      <a href="/">대시보드</a>
      <a href="/library.html">코드 정리</a>
      <a href="/graph.html" class="on">연결 지도</a>
      <a href="/oj/">연습장</a>
    </nav>
    <span class="muted small" id="who"></span>
  </header>

  <main class="graph-stage">
    <canvas id="graph"></canvas>

    <div class="glass graph-title">
      <h1>문제 지도</h1>
      <div class="graph-stats" id="stats"></div>
    </div>

    <div class="glass graph-controls">
      <label class="chip"><input type="checkbox" id="group-category" checked><span>분류로 묶기</span></label>
      <label class="chip"><input type="checkbox" id="show-all"><span>분류 안 된 문제도</span></label>
      <button class="chip" id="fit" type="button" title="전체 보기" aria-label="전체 보기">⤢</button>
      <button class="chip ai" id="organize" type="button">✦ Claude로 정리</button>
    </div>

    <div class="glass graph-toast" id="toast" role="status" aria-live="polite" hidden></div>

    <div class="glass graph-legend">
      <span><i class="legend-dot" style="background:var(--ac)"></i>해결</span>
      <span><i class="legend-dot" style="background:var(--wa)"></i>미해결</span>
      <span><i class="legend-dot hollow"></i>안 풀어봄</span>
      <span><i class="legend-line flow"></i>확장 ↔ 기본</span>
      <span><i class="legend-line dotted"></i>비슷한 문제</span>
    </div>

    <aside class="glass graph-side" id="side" hidden></aside>
  </main>

  <script type="module" src="graph.js"></script>
</body>
</html>
